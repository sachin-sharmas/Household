services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: https://household-a43p.onrender.com/api
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
